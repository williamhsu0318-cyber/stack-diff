name: Model Truth Sentinel & Verification

on:
  schedule:
    # Run every Wednesday at 02:00 UTC (10:00 AM Taiwan Time)
    - cron: '0 2 * * 3'
  workflow_dispatch:
    inputs:
      broadcast:
        description: 'Broadcast bulletin to Discord'
        type: boolean
        default: false

jobs:
  verify-and-sync-models:
    name: Sync Models & Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Ground-Truth Synchronizer
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || 'https://discord.com/api/webhooks/1544664132404383744/Kr6ZeLCY-NG1_lqoQSf6e00bWVwor87QxMVxjvTAL-jmaiGVRXYjPIDSmDdCOE6FFc8G' }}
        run: |
          if [ "${{ inputs.broadcast }}" = "true" ]; then
            python scripts/auto_sync_latest_models.py --broadcast
          else
            python scripts/auto_sync_latest_models.py
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Astro Static Build
        run: npm run build
