name: Monday Observation Sentinel (10 KPIs)

on:
  schedule:
    # Runs every Monday at 01:00 UTC (09:00 AM Taiwan Time, UTC+8)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: '推播模式 (weekly: 週報 / summary: 即時看板)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - summary

jobs:
  send-discord-kpi:
    name: Send 10-KPI Discord Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Broadcast 10-KPI Report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || 'https://discord.com/api/webhooks/1544664132404383744/Kr6ZeLCY-NG1_lqoQSf6e00bWVwor87QxMVxjvTAL-jmaiGVRXYjPIDSmDdCOE6FFc8G' }}
        run: |
          MODE="${{ inputs.mode || 'weekly' }}"
          python scripts/send_discord_kpi.py --mode "$MODE"
